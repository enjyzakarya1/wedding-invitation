<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawsan & Hassan — Wedding Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Overlay -->
  <div class="background-overlay"></div>

  <main class="page-container">
    
    <!-- Hero Section (Clickable Envelope) -->
    <section class="hero-section">
      <p class="instruction-text">Tap the envelope to open</p>
      
      <div class="envelope-wrapper">
        <div class="envelope" id="envelope">
          <div class="flap"></div>
          <div class="pocket"></div>
          
          <!-- Wax Seal (Optional display on flap) -->
          <img src="wax-seal.png" alt="Wax Seal" class="wax-seal-img" onerror="this.style.display='none'">
          
          <!-- Envelope Front Image -->
          <img src="new-envelope.jpg" alt="Wedding Envelope" class="envelope-img">
          
          <!-- Pop-out Invitation Card -->
          <div class="card" id="card">
            <h2>Sawsan & Hassan</h2>
            <p class="subtitle">Save the Date</p>
            <p class="date">November 13, 2026</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Details Section (Swipe / Scroll Down) -->
    <section class="details-section">
      <div class="details-card">
        <h3>Wedding Details</h3>
        
        <div class="detail-item">
          <h4>Location</h4>
          <p>The Grand Ballroom</p>
          <p>123 Elegance Way, Cairo</p>
        </div>
        
        <div class="detail-item">
          <h4>Schedule</h4>
          <p>Ceremony: 6:00 PM</p>
          <p>Dinner & Celebration: 7:30 PM</p>
        </div>

        <div class="detail-item">
          <h4>RSVP</h4>
          <p>Please confirm your attendance by October 15, 2026.</p>
        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
