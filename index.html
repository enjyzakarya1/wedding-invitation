<!-- Music Element & Toggle Button -->
<audio id="bg-music" loop preload="auto">
  <source src="wedding-song.mp3" type="audio/mpeg">
</audio>

<button id="music-toggle" class="music-btn" aria-label="Toggle Music">
  🎵 Play Music
</button>

<!-- Envelope Container -->
<div class="envelope-wrapper" id="envelope-wrapper">
  <!-- Interactive Envelope -->
  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="pocket"></div>
    
    <!-- Updated Envelope Image -->
    <img src="new-envelope.jpg" alt="Wedding Envelope" class="envelope-img">
    
    <!-- Pop-out Card -->
    <div class="card" id="card">
      <h2>Sawsan & Hassan</h2>
      <p>Save the Date — November 13, 2026</p>
    </div>
  </div>
</div>
