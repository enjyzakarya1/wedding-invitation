<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <!-- Google Fonts for Elegant Serif & Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="envelope-wrapper" id="envelopeWrapper">
      <!-- The Outer Envelope -->
      <div class="envelope">
        <div class="flap"></div>
        <div class="pocket"></div>
        
        <!-- The Invitation Card -->
        <div class="card" id="weddingCard">
          <div class="card-border">
            <div class="card-content">
              <p class="pre-title">JOIN US TO CELEBRATE</p>
              <h1 class="couple-names">Partner 1 <br><span>&amp;</span><br> Partner 2</h1>
              
              <div class="monogram">M</div>
              
              <div class="details">
                <p class="date">SATURDAY, SEPTEMBER 20, 2026</p>
                <p class="time">AT 4:00 IN THE AFTERNOON</p>
                <div class="divider"></div>
                <p class="venue-name">Grand Garden Venue</p>
                <p class="address">123 Main Street, City Name</p>
              </div>

              <p class="footer-note">Reception to follow</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Interactive Open Button -->
      <button class="open-btn" onclick="openEnvelope()">Open Invitation</button>
    </div>
  </div>

  <script>
    function openEnvelope() {
      const wrapper = document.getElementById('envelopeWrapper');
      wrapper.classList.add('open');
    }
  </script>
</body>
</html>
