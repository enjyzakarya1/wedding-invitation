<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawsan & Hassan - Wedding Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Envelope Container -->
  <div class="envelope-wrapper" id="envelope-wrapper">
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="pocket"></div>
      
      <!-- Envelope Image -->
      <img src="new-envelope.jpg" alt="Wedding Envelope" class="envelope-img">
      
      <!-- Pop-out Card -->
      <div class="card" id="card">
        <h2>Sawsan & Hassan</h2>
        <p>Save the Date — November 13, 2026</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
