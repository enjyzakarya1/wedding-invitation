<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date — Sawsan & Hassan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="envelope-wrapper">
    <div class="envelope" id="envelope">
      <!-- Envelope Flap & Pocket -->
      <div class="flap"></div>
      <div class="pocket"></div>
      
      <!-- Envelope Image Overlay -->
      <img src="new-envelope.jpg" alt="Wedding Envelope" class="envelope-img">
      
      <!-- Pop-out Invitation Card -->
      <div class="card" id="card">
        <h2>Sawsan & Hassan</h2>
        <p>Save the Date</p>
        <p class="date">November 13, 2026</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
