<!-- REAL OIL PAINTING BACKGROUND -->
  <div class="bg-overlay"></div>
  <img src="background.jpg.jpg" alt="Floral Oil Painting Background" class="bg-image" />

  <div class="main-wrapper">
    <!-- REALISTIC 2D ENVELOPE CONTAINER -->
    <section class="envelope-container" id="envelopeWrapper">
      <div class="envelope-card">
        
        <!-- ENVELOPE BASE / BACK -->
        <div class="envelope-body">
          
          <!-- INNER LETTER / CARD THAT SLIDES UP -->
          <div class="letter-card">
            <p class="letter-title">You're Invited</p>
          </div>

          <!-- ENVELOPE FRONT COVER WITH LACE -->
          <div class="envelope-front">
            <img src="envelope-front.png.jpg" alt="Lace Envelope" class="envelope-img" />
            
            <!-- REAL ORGANIC WAX SEAL IMAGE OVERLAY -->
            <div class="seal-container" id="waxSeal">
              <img src="wax-seal.png.jpg" alt="Burgundy Wax Seal" class="wax-img" />
            </div>
          </div>

        </div>

      </div>
      <p class="tap-hint" id="tapHint">Tap wax seal to open</p>
    </section>
